# Route from walk ../../drone_tests/walks/walk-20261107-215520/vio.csv, t = 13.0..59.0 s, simplified to within 0.1 m; heights = the walk rangefinder at each waypoint (dips over obstacles ignored).
# Start frame: metres from the takeoff point. x = forward (nose at takeoff), y = left, z = up.
# START ON THE X: drone CENTRED on the black X, facing the same way as the walk start (nose along the floor
# line toward the pipe wall, angled a few degrees right of it). The walk started ~0.44 m behind the X
# (stereo + floor geometry from the walk camera, +-5 cm), so every waypoint here is shifted 0.44 m back.
# Pilot: Altitude -> arm -> Position. Kill switch is the only protection against drifting into a wall.
name: course-walk-DRAFT
takeoff_height: 1.00     # walk heights from the rangefinder (hand-carried), not a fixed 0.9
speed: 0.3
corner_speed: 0.2
max_height: 1.5
max_cross_track: 50.0     # off-path landing OFF (team decision 2026-11-08; the takeoff slide tripped 0.4 m)
climb_speed: 0.5         # get through the low, sliding part of the takeoff faster
yaw: path                # nose (camera) faces the way ahead; turns in place first (yaw_align_deg 20), max 30 deg/s
end: land
